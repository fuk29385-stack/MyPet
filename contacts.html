<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Pet — Контакты</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <div class="container header-inner">
          <a href="index.html" class="logo" aria-label="My Pet home"><span class="logo-mark"><img class="logo-photo" src="images (1).png" alt="" /></span><span>My Pet</span></a>
          <nav class="main-nav" aria-label="Основное меню">
            <a href="index.html">Главная</a><a href="catalog.html">Каталог</a><a href="orders.html">Мои покупки</a>
            <a href="index2.html">Маленькие питомцы</a><a href="metrics%20(1).html">Метрики</a><a href="about.html">О нас</a><a href="contacts.html">Контакты</a>
          </nav>
          <div class="header-tools"><label class="theme-toggle"><input id="themeToggle" type="checkbox" role="switch" aria-label="Тёмная тема" /><span class="theme-switch" aria-hidden="true"><span></span></span><span class="theme-toggle-label" data-theme-label>Светлая</span></label><a class="icon-button" href="favorites.html" aria-label="Избранное">♡</a><a class="cart-button" href="cart.html">🛒 Корзина <span class="count" id="cartCount">0</span></a></div>
        </div>
      </header>
      <main class="container section-space">
        <section class="contacts">
          <div class="contact-details">
            <span class="eyebrow">Контакты</span><h2>Свяжитесь с нами</h2>
            <ul class="contact-list"><li>📍 Астана, Казахстан</li><li>📞 +7 (7172) 123-45-67</li><li>✉️ hello@pawshop.kz</li></ul>
          </div>
          <form class="contact-form" id="contactForm" novalidate>
            <div class="form-field"><label for="name">Имя</label><input id="name" name="name" type="text" placeholder="Ваше имя" /></div>
            <div class="form-field"><label for="email">Email</label><input id="email" name="email" type="email" placeholder="example@mail.com" /></div>
            <div class="form-field"><label for="message">Сообщение</label><textarea id="message" name="message" rows="4" placeholder="Напишите нам..."></textarea></div>
            <button class="primary-btn" type="submit">Отправить сообщение</button>
          </form>
        </section>
      </main>
    </div>
    <div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>
    <script src="script.js"></script>
  </body>
</html>
